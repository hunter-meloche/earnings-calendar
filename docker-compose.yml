services:
  app:
    build: .
    restart: always
    ports:
      - "8103:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/earnings/upcoming?days=7')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
